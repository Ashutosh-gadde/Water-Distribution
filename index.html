<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latur Municipal Corporation — Water Network Data & Distribution Portal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--side:#1d2329;--sideT:#c9d3dc;--acc:#2f8f2f;--bg:#eef1f4;--surf:#fff;--text:#18222c;--mut:#5d6b78;--line:#d6dde4;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Mukta","Nirmala UI",sans-serif;display:flex;min-height:100vh}aside{width:220px;background:var(--side);color:var(--sideT);padding:14px;display:flex;flex-direction:column;gap:14px}aside b{color:#fff;font-size:1rem}aside small{color:#9aa9b5}nav{display:grid;gap:5px}nav button{background:none;border:0;color:inherit;text-align:left;padding:9px;border-radius:6px;cursor:pointer}nav button.active,nav button:hover{background:#303a43;color:white}main{flex:1;min-width:0;display:flex;flex-direction:column}.top{background:var(--surf);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.view{padding:16px;overflow:auto}.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.card,.panel{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}.card{border-top:3px solid var(--acc)}.card strong{display:block;font-size:1.55rem}.muted{color:var(--mut);font-size:.82rem}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:12px}#network-map{height:min(70vh,680px);min-height:400px;border-radius:8px;z-index:1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;font-size:.8rem;color:var(--mut)}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;color:#18222c;max-width:100%}.btn{border:0;background:var(--acc);color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.msg{padding:9px 12px;border:1px solid var(--line);border-radius:6px;margin:8px 0}.msg.error{color:var(--red);border-color:var(--red)}.msg.ok{border-color:var(--acc)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.72rem;color:var(--mut);text-transform:uppercase}.badge{border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:.75rem}.login{max-width:460px;margin:5vh auto}.login h2{margin-top:0}.warning{background:#fff7ed;border-color:#fdba74}@media(max-width:800px){aside{width:62px;padding:8px}aside b,aside small,.navtext{display:none}nav button{text-align:center;padding:10px 2px}.grid2{grid-template-columns:1fr}#network-map{min-height:360px}}
</style>
 <script type="importmap">
  {
    "imports": {
      "leaflet": "https://esm.sh/leaflet?bundle"
    }
  }
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<aside><div><b>Latur Municipal Corporation</b><br><small>Water Network Portal</small></div><nav id="nav"></nav><div class="muted" id="side-user"></div></aside>
<main><header class="top"><strong id="page-title">Water Network Portal</strong><span class="sp"></span><span id="user-label" class="muted">Not signed in</span><button class="btn secondary" id="language">मराठी</button><button class="btn secondary hidden" id="logout">Sign out</button></header><section class="view" id="app"></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { supabase, signIn, signOut, getMyProfile, loadDashboard, listAssets, listMeters, listSchedules, adminCreateUser, runScheduleAction } from './src/backend.js';
import { initNetworkMap } from './src/map.js';
const $=s=>document.querySelector(s); let profile=null, page='dashboard', lang='en', mapObj=null, notice='';
const labels={en:{dashboard:'Dashboard',map:'GIS Map',assets:'Assets',meters:'Water meters',schedules:'Schedules',admin:'User administration',login:'Sign in',email:'Email',password:'Password',signIn:'Sign in',signOut:'Sign out',public:'Public view',load:'Refresh data',create:'Create account',name:'Display name',role:'Role',operatorCode:'Operator code',submit:'Create and invite',scheduleAction:'Schedule action',reason:'Reason / remarks',noAccess:'You do not have permission to open this page.',demo:'This deployment shell is connected only after Supabase settings, database migration, real GIS import and RLS testing are complete. Do not use it as an operational system before acceptance testing.',notSigned:'Sign in with your municipal account to access authorized layers and workflows.',assetsCount:'Network assets',meterCount:'Water meters',scheduleCount:'Schedules',verified:'Verified',status:'Status',code:'Code',type:'Type',nameCol:'Name',updated:'Updated',date:'Date',planned:'Planned',action:'Action',publicNote:'Public accounts see only approved public records. Exact water-network infrastructure is restricted to authorized staff.',meterHelp:'Meter customer/connection details are held in a separate restricted table.',mapFail:'Map or data could not load. Check project configuration, network access and RLS policies.'},mr:{dashboard:'डॅशबोर्ड',map:'जीआयएस नकाशा',assets:'मालमत्ता',meters:'पाणी मीटर',schedules:'वेळापत्रके',admin:'वापरकर्ता प्रशासन',login:'लॉगिन',email:'ईमेल',password:'पासवर्ड',signIn:'लॉगिन करा',signOut:'बाहेर पडा',public:'सार्वजनिक दृश्य',load:'डेटा पुन्हा लोड करा',create:'खाते तयार करा',name:'पूर्ण नाव',role:'भूमिका',operatorCode:'ऑपरेटर कोड',submit:'खाते तयार करून आमंत्रण पाठवा',scheduleAction:'वेळापत्रक कृती',reason:'कारण / शेरा',noAccess:'हे पृष्ठ उघडण्याची परवानगी नाही.',demo:'Supabase सेटिंग्ज, डेटाबेस migration, वास्तविक GIS डेटा आयात आणि RLS चाचण्या पूर्ण झाल्यानंतरच हे पोर्टल जोडा. स्वीकृती चाचणीपूर्वी कार्यरत प्रणाली म्हणून वापरू नका.',notSigned:'अधिकृत नकाशे आणि कामकाजासाठी महानगरपालिकेच्या खात्याने लॉगिन करा.',assetsCount:'जाळे मालमत्ता',meterCount:'पाणी मीटर',scheduleCount:'वेळापत्रके',verified:'सत्यापित',status:'स्थिती',code:'कोड',type:'प्रकार',nameCol:'नाव',updated:'अद्ययावत',date:'दिनांक',planned:'नियोजित',action:'कृती',publicNote:'सार्वजनिक वापरकर्त्यांना फक्त मंजूर सार्वजनिक नोंदी दिसतात. जलजाळ्याचे अचूक तपशील अधिकृत कर्मचाऱ्यांसाठी मर्यादित आहेत.',meterHelp:'मीटरचे ग्राहक/जोडणी तपशील स्वतंत्र प्रतिबंधित तक्त्यात ठेवले आहेत.',mapFail:'नकाशा किंवा डेटा लोड झाला नाही. प्रकल्प सेटिंग्ज, नेटवर्क आणि RLS धोरण तपासा.'}};
const t=k=>labels[lang][k]||k, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const role=()=>profile?.role||'anon'; const canStaff=()=>['operator','officer','admin'].includes(role()); const canManage=()=>['officer','admin'].includes(role());
function setNotice(message,kind='ok'){notice=message;const el=$('#notice');if(el){el.className='msg '+(kind==='error'?'error':'ok');el.textContent=message;el.classList.remove('hidden')}}
function nav(){if(!profile){$('#nav').innerHTML='';return}const items=[['dashboard','▦'],['map','⌖'],['assets','▤'],['meters','◉'],['schedules','◷'],...(role()==='admin'?[['admin','⚙']]:[])];$('#nav').innerHTML=items.map(([k,icon])=>`<button data-page="${k}" class="${page===k?'active':''}" title="${t(k)}"><span>${icon}</span> <span class="navtext">${t(k)}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function shell(content){$('#page-title').textContent=t(page);$('#app').innerHTML=content;nav();$('#language').textContent=lang==='en'?'मराठी':'English';$('#logout').classList.toggle('hidden',!profile);$('#user-label').textContent=profile?`${profile.display_name||profile.email} · ${profile.role}`:'Not signed in';$('#side-user').textContent=profile?.email||''}
function loginView(){shell(`<div class="login panel"><h2>${t('login')}</h2><p class="muted">${t('notSigned')}</p><div id="notice" class="msg hidden"></div><form id="login-form"><label>${t('email')}<input id="email" type="email" autocomplete="username" required></label><br><label>${t('password')}<input id="password" type="password" autocomplete="current-password" required></label><br><button class="btn" type="submit">${t('signIn')}</button></form><p class="muted">${t('publicNote')}</p></div>`);$('#login-form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{profile=await signIn($('#email').value,$('#password').value);page='dashboard';await render()}catch(err){setNotice(err.message,'error')}finally{btn.disabled=false}}}
async function render(){if(!profile){loginView();return}nav();const app=$('#app');app.innerHTML=`<div id="notice" class="msg ${notice?'':'hidden'}">${esc(notice)}</div><div class="muted">${t('demo')}</div>`;if(notice)$('#notice').textContent=notice;try{
 if(page==='dashboard'){const d=await loadDashboard();app.innerHTML=`<div class="cardgrid"><div class="card"><strong>${d.assets}</strong>${t('assetsCount')}</div><div class="card"><strong>${d.meters}</strong>${t('meterCount')}</div><div class="card"><strong>${d.schedules.length}</strong>${t('scheduleCount')}</div><div class="card"><strong>${d.schedules.filter(s=>s.status==='published').length}</strong>${t('status')}: published</div></div><div class="panel"><h3>${t('dashboard')}</h3><p>${t('publicNote')}</p><button class="btn secondary" id="refresh">${t('load')}</button><p class="muted">${t('demo')}</p></div>`;$('#refresh').onclick=render;
 }else if(page==='map'){app.innerHTML=`<div class="panel"><div class="row"><strong>${t('map')}</strong><span class="sp"></span><button class="btn secondary" id="refresh-map">${t('load')}</button></div><div id="network-map"></div><p class="muted">${t('publicNote')}</p></div>`;try{mapObj=await initNetworkMap('network-map')}catch(e){app.insertAdjacentHTML('afterbegin',`<div class="msg error">${t('mapFail')} ${esc(e.message)}</div>`)}$('#refresh-map').onclick=render;
 }else if(page==='assets'){const rows=await listAssets();app.innerHTML=`<div class="panel"><h3>${t('assets')} (${rows.length})</h3>${table(rows,[['code',r=>r.asset_code],['type',r=>r.asset_type],['nameCol',r=>r.name],['verified',r=>r.verification],['updated',r=>new Date(r.updated_at).toLocaleString()]])}</div>`;
 }else if(page==='meters'){const rows=await listMeters();app.innerHTML=`<div class="panel"><h3>${t('meters')} (${rows.length})</h3><p class="muted">${t('meterHelp')}</p>${canManage()?meterForm():''}${table(rows,[['code',r=>r.meter_code],['type',r=>r.meter_type],['status',r=>r.status],['last_reading',r=>r.last_reading??'—'],['last_reading_at',r=>r.last_reading_at?new Date(r.last_reading_at).toLocaleString():'—']])}</div>`;if(canManage())$('#meter-form').onsubmit=createMeter;
 }else if(page==='schedules'){const rows=await listSchedules();app.innerHTML=`<div class="panel"><h3>${t('schedules')}</h3>${canManage()?scheduleForm():''}${table(rows,[['code',r=>r.schedule_code],['date',r=>r.service_date],['planned',r=>`${r.planned_start}–${r.planned_end}`],['status',r=>r.status],['action',r=>scheduleButtons(r)]])}</div>`;app.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const reason=$('#reason')?.value||'';await runScheduleAction({schedule_id:b.dataset.id,action:b.dataset.action,reason});setNotice('Schedule updated.');render()}catch(e){setNotice(e.message,'error')}});if(canManage())$('#schedule-form').onsubmit=createSchedule;
 }else if(page==='admin'&&role()==='admin'){app.innerHTML=`<div class="panel"><h3>${t('create')}</h3><p class="muted">Account creation is performed by a server-side Edge Function. The service-role key is never sent to the browser.</p><div id="notice" class="msg hidden"></div><form id="user-form"><div class="row"><label>${t('email')}<input id="new-email" type="email" required></label><label>${t('name')}<input id="new-name" required></label><label>${t('role')}<select id="new-role"><option value="operator">Operator</option><option value="officer">Officer</option><option value="citizen">Citizen</option></select></label><label>${t('operatorCode')}<input id="new-code"></label><button class="btn">${t('submit')}</button></div></form></div>`;$('#user-form').onsubmit=async e=>{e.preventDefault();try{const r=await adminCreateUser({email:$('#new-email').value,display_name:$('#new-name').value,role:$('#new-role').value,operator_code:$('#new-code').value});setNotice(r.message)}catch(err){setNotice(err.message,'error')}};
 }else{app.innerHTML=`<div class="panel">${t('noAccess')}</div>`}
 }catch(err){app.insertAdjacentHTML('afterbegin',`<div class="msg error">${esc(err.message||t('mapFail'))}</div>`)}nav()}
function table(rows,cols){if(!rows.length)return '<p class="muted">No records found.</p>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(t(c[0]))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function meterForm(){return `<details class="panel"><summary>Add water meter</summary><form id="meter-form"><div class="row"><label>Meter code<input id="m-code" required></label><label>Type<select id="m-type"><option>mechanical</option><option>smart</option><option>bulk</option><option>other</option></select></label><label>Status<select id="m-status"><option>active</option><option>inactive</option><option>faulty</option><option>removed</option><option>unknown</option></select></label><label>Longitude<input id="m-lon" type="number" step="any" required></label><label>Latitude<input id="m-lat" type="number" step="any" required></label><button class="btn">Save meter</button></div></form></details>`}
async function createMeter(e){e.preventDefault();try{const lon=Number($('#m-lon').value),lat=Number($('#m-lat').value);if(lon < -180||lon>180||lat < -90||lat>90)throw new Error('Coordinates must be WGS84 longitude/latitude.');const {error}=await supabase.from('water_meters').insert({meter_code:$('#m-code').value.trim(),meter_type:$('#m-type').value,status:$('#m-status').value,geom:{type:'Point',coordinates:[lon,lat]},created_by:profile.id,updated_by:profile.id});if(error)throw error;setNotice('Meter saved.');render()}catch(err){setNotice(err.message,'error')}}
function scheduleForm(){return `<details class="panel"><summary>Create schedule</summary><form id="schedule-form"><div class="row"><label>Schedule code<input id="s-code" required></label><label>Zone asset UUID<input id="s-zone" required></label><label>Operator user UUID<input id="s-op"></label><label>Date<input id="s-date" type="date" required></label><label>Start<input id="s-start" type="time" required></label><label>End<input id="s-end" type="time" required></label><button class="btn">Create draft</button></div></form></details><label style="margin-bottom:8px">${t('reason')}<input id="reason"></label>`}
async function createSchedule(e){e.preventDefault();try{const start=$('#s-start').value,end=$('#s-end').value;if(end<=start)throw new Error('End time must be later than start time.');const {error}=await supabase.from('distribution_schedules').insert({schedule_code:$('#s-code').value.trim(),zone_asset_id:$('#s-zone').value.trim(),operator_id:$('#s-op').value.trim()||null,service_date:$('#s-date').value,planned_start:start,planned_end:end,created_by:profile.id,updated_by:profile.id,status:'draft'});if(error)throw error;setNotice('Draft schedule created.');render()}catch(err){setNotice(err.message,'error')}}
function scheduleButtons(s){const buttons=[];if(['officer','admin'].includes(role())){if(s.status==='draft')buttons.push(['submit','Submit']);if(s.status==='submitted')buttons.push(['approve','Approve'],['reject','Reject']);if(s.status==='approved')buttons.push(['publish','Publish']);if(['draft','submitted','approved','published'].includes(s.status))buttons.push(['cancel','Cancel'])}if(role()==='operator'){if(s.status==='published')buttons.push(['start','Start']);if(s.status==='active')buttons.push(['pause','Pause'],['stop','Stop']);if(s.status==='paused')buttons.push(['resume','Resume'],['stop','Stop'])}return buttons.map(([a,l])=>`<button class="btn secondary" data-action="${a}" data-id="${s.id}">${l}</button>`).join(' ')||'—'}
$('#language').onclick=()=>{lang=lang==='en'?'mr':'en';render()};$('#logout').onclick=async()=>{try{await signOut()}finally{profile=null;page='dashboard';render()}};
supabase.auth.onAuthStateChange((_event,session)=>{queueMicrotask(async()=>{if(!session){profile=null;render();return}try{profile=await getMyProfile();if(!profile)throw new Error('No profile');render()}catch(e){profile=null;render();setNotice(e.message,'error')}})});
try{profile=await getMyProfile()}catch(e){profile=null}render();
</script>
</body></html>
